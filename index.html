<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-commerce</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style href="styles/signup.css"></style>
</head>

<body>
  <nav class="navbar bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand">
        <img src="images/E-martlogo.png" width="40" height="34" class="d-inline-block align-text-top">
        E-com Mart
      </a>
      <div class="side"> <a href="signup.html"><button type="button" class="btn btn-primary">Sign up</button></a></div>
     
      <!-- <button class="btn btn-dark" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasRight"
        aria-controls="offcanvasRight">Menu</button>
      </div> -->
      
        <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor" class="bi bi-person-circle"
          viewBox="0 0 16 16">
          <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0" />
          <path fill-rule="evenodd"
            d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1" />
        </svg>
      
    </div>
  </nav>


  <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasRight" aria-labelledby="offcanvasRightLabel">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="offcanvasRightLabel">Menu Buttons are</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
      ...
    </div>
  </div>


  <!--Image cards-->


  <div class="container mt-4">
    <div id="loopproducts"></div>
  </div>



  <script>
    fetch('JSON/products.json')
      .then(response => response.json())
      .then(products => {
        const productList = document.getElementById("loopproducts");
        let productCart = '<div class="row">';
        products.forEach((product, index) => {
          productCart += `
        <div class="col-12 col-sm-6 col-md-4 col-lg-4 mb-4">
          <div class="card" style="width: 18rem;">
            <img src="${product.img}" class="card-img-top" alt="${product.Id}">
            <div class="card-body">
              <h5 class="card-title">${product.Title}</h5>
              <p class="card-text">${product.Description}</p>
              <p class="card-text">${product.Id}</p>
              <h6 class="card-text">Price: ${product.Price}</h6>
              <a href="Orderpage.html?id=${encodeURIComponent(product.Id)}&title=${encodeURIComponent(product.Title)}&price=${encodeURIComponent(product.Price)}" class="btn btn-primary">Order it</a>
            </div>
          </div>
        </div>
      `;
          // Close and open a new row every 3 cards
          if ((index + 1) % 3 === 0 && index + 1 !== products.length) {
            productCart += `</div><div class="row">`;
          }
        });
        productCart += '</div>';
        productList.innerHTML = productCart;
      })
      .catch(error => console.log("Error Fetching Products"));

  </script>

  <!--Bootstrap script tag-->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <footer>
    Copyrights reserved by sivanesh
  </footer>
</body>

</html>
